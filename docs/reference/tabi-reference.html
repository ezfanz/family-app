<style>
/* ---- Tabi tokens (light / dark) ---- */
:root {
  --paper: #F7F7F5; --surface: #FFFFFF; --ink: #1C1C1E; --stone: #6B6B70; --hair: #E4E4E1; --action: #2A3B8F;
  --osaka: #E5171F; --nara: #7E4FB0; --kyoto: #00968F; --tokyo: #4A8410; --fuji: #2563A8;
  --done: #2F7A49; --skipped: #9198A4; --now: #D2281E;
}
.dark {
  --paper: #121214; --surface: #1C1C20; --ink: #EDEDED; --stone: #9A9AA2; --hair: #2C2C32; --action: #9DAEFF;
  --tokyo: #9AD34A;
}
/* ---- reference page shell (not part of the app) ---- */
body { margin: 0; background: #DADAD6; font-family: 'Zen Kaku Gothic New', 'Hiragino Sans', 'Noto Sans JP', system-ui, sans-serif; }
.gallery { display: flex; flex-wrap: wrap; gap: 48px 40px; padding: 40px; align-items: flex-start; }
.shot { margin: 0; }
.shot figcaption { font-size: 14px; font-weight: 700; color: #3A3A3E; margin: 0 0 10px 4px; }
.frame { width: 390px; height: 844px; overflow: auto; border-radius: 28px; border: 1px solid #C8C8C4; position: relative; scrollbar-width: thin; }
/* ---- app styles ---- */


a{color:#2A3B8F}a:hover{color:#1C1C1E}
.i{fill:none;stroke:currentColor;stroke-width:1.75;stroke-linecap:round;stroke-linejoin:round}
.tnum{font-variant-numeric:tabular-nums}
.strip{scrollbar-width:none}.strip::-webkit-scrollbar{display:none}
button,input,select,textarea{font-family:inherit}
button:focus-visible,a:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:2px solid #2A3B8F;outline-offset:2px}
@keyframes ring{0%,100%{box-shadow:0 0 0 5px rgba(210,40,30,0.18)}50%{box-shadow:0 0 0 9px rgba(210,40,30,0.05)}}
.pulse{animation:ring 2.4s ease-in-out infinite}
@keyframes pop{from{transform:scale(0.4);opacity:0}to{transform:scale(1);opacity:1}}
.pop{animation:pop 0.18s ease-out}
@keyframes rise{from{opacity:0;transform:translateY(-4px)}to{opacity:1;transform:none}}
.rise{animation:rise 0.2s ease-out}
@media (prefers-reduced-motion: reduce){.pulse,.pop,.rise{animation:none}}
.pill input{position:absolute;opacity:0;width:1px;height:1px}.pill input:checked + span{background:#2A3B8F;border-color:#2A3B8F;color:#FFFFFF}.pill input:focus-visible + span{outline:2px solid #2A3B8F;outline-offset:2px}

</style>

          (places ? '<div><div style="' + label + '">Places</div><div style="display: flex; flex-wrap: wrap; gap: 8px; margin-top: 8px">' + places + '</div></div>' : '') +
          '<fieldset style="border: 0; margin: 0; padding: 0; min-width: 0"><legend style="padding: 0; ' + label + '">Status</legend>' +
          '<div style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 3px; padding: 3px; margin-top: 8px; border-radius: 10px; border: 1px solid ' + P.hair + '; background: ' + P.paper + '">' + segs + '</div></fieldset>' +
          '<div><label for="note-' + s.id + '" style="display: block; ' + label + '">My note</label><textarea id="note-' + s.id + '" rows="2" placeholder="Only you can see this" style="display: block; width: 100%; box-sizing: border-box; margin-top: 6px; padding: 10px 12px; border-radius: 10px; font-size: 16px; line-height: 1.45; resize: vertical; border: 1px solid ' + P.hair + '; background: ' + P.paper + '; color: ' + P.ink + '"></textarea></div>' +
          (cfg.canEdit ? '<a href="#addstop" style="display: flex; align-items: center; min-height: 44px; font-size: 15px; font-weight: 700; text-decoration: none; color: ' + P.action + '">Edit or delete this stop</a>' : '') +
          '</div>';
      }

      return '<li style="position: relative; display: grid; grid-template-columns: 52px 44px minmax(0, 1fr); column-gap: 6px; padding-bottom: 12px">' +
        '<div aria-hidden="true" style="position: absolute; left: 78px; width: 4px; ' + line + '"></div>' +
        '<div class="tnum" style="padding-top: 12px; text-align: right; font-size: 15px; font-weight: 700; line-height: 20px; color: ' + (isSkipped ? P.stone : P.ink) + '">' + esc(s.time) + '</div>' +
        '<div style="display: flex; justify-content: center; align-items: flex-start">' +
        '<button type="button" data-act="cycle" data-id="' + s.id + '" aria-label="' + esc(s.name + ': ' + WORD[status] + '. Tap to change.') + '" style="position: relative; width: 44px; height: 44px; padding: 0; border: 0; background: none; cursor: pointer; display: flex; align-items: center; justify-content: center">' +
        '<span class="' + (isNow ? 'pulse' : '') + '" style="width: 22px; height: 22px; border-radius: 50%; box-sizing: border-box; display: flex; align-items: center; justify-content: center; ' + dot + '">' + (isDone ? TICK : '') + (isSkipped ? DASH : '') + '</span>' +
        '</button></div>' +
        '<div style="border-radius: 12px; overflow: hidden; min-width: 0; background: ' + P.surface + '; border: ' + (isNow ? '1.5px solid ' + P.now : '1px solid ' + P.hair) + '">' +
        '<button type="button" data-act="toggle" data-id="' + s.id + '" aria-expanded="' + open + '" style="display: flex; flex-direction: column; gap: 4px; width: 100%; text-align: left; background: none; border: 0; padding: 11px 14px 12px; color: inherit; cursor: pointer; min-height: 44px">' +
        (isNow ? '<span style="font-size: 13px; font-weight: 700; color: ' + P.nowText + '">Now</span>' : '') +
        '<span style="font-size: 17px; font-weight: 700; line-height: 1.35; ' + (isSkipped ? 'color: ' + P.stone + '; text-decoration: line-through;' : 'color: ' + P.ink + ';') + '">' + esc(s.name) + '</span>' +
        (s.sub ? '<span style="font-size: 14px; line-height: 1.4; color: ' + P.stone + '">' + esc(s.sub) + '</span>' : '') +
        (tags ? '<span style="display: flex; flex-wrap: wrap; gap: 6px; margin-top: 4px">' + tags + '</span>' : '') +
        '</button>' + detail + '</div></li>';
    }).join('');
  }

  list.addEventListener('click', function (e) {
    const b = e.target.closest('[data-act]');
    if (!b) return;
    const id = b.dataset.id;
    if (b.dataset.act === 'cycle') state.status[id] = NEXT[state.status[id]];
    else if (b.dataset.act === 'set') state.status[id] = b.dataset.v;
    else if (b.dataset.act === 'toggle') state.open = state.open === id ? null : id;
    render();
  });
  render();
}

/* ---------- Shopping ---------- */
function mountShopping(root, cfg) {
  const P = cfg.P;
  const items = cfg.items.map(function (x) { return Object.assign({}, x); });
  const list = root.querySelector('ul.shop-list');
  const rateIn = root.querySelector('[data-in="rate"]');
  const bankIn = root.querySelector('[data-in="banked"]');
  const num = function (v) { const n = parseFloat(String(v).replace(/[^0-9.]/g, '')); return isNaN(n) ? 0 : n; };
  const rm = function (n) { return 'RM' + n.toLocaleString('en-MY', { minimumFractionDigits: 2, maximumFractionDigits: 2 }); };
  const rm0 = function (n) { return 'RM' + Math.round(n).toLocaleString('en-MY'); };
  const yen = function (n) { return '¥' + Math.round(n).toLocaleString('en-US'); };
  const k = function (name) { return root.querySelector('[data-k="' + name + '"]'); };

  function renderList() {
    const r = num(rateIn.value) / 100;
    list.innerHTML = items.map(function (it) {
      return '<li style="display: grid; grid-template-columns: 44px minmax(0, 1fr) 112px; align-items: center; column-gap: 8px; padding: 10px 0; border-bottom: 1px solid ' + P.hair + '">' +
        '<label style="width: 44px; height: 44px; display: flex; align-items: center; justify-content: center; cursor: pointer"><input type="checkbox" data-id="' + it.id + '"' + (it.bought ? ' checked' : '') + ' aria-label="Bought ' + esc(it.name) + '" style="width: 22px; height: 22px; margin: 0; accent-color: ' + P.done + '"></label>' +
        '<div style="min-width: 0"><div style="font-size: 16px; font-weight: 700; line-height: 1.35; color: ' + (it.bought ? P.stone : P.ink) + '">' + esc(it.name) + '</div>' +
        '<div class="tnum" data-meta="' + it.id + '" style="font-size: 13px; font-weight: 500; line-height: 1.45; color: ' + P.stone + '; margin-top: 2px">×' + it.qty + ' · est ' + yen(it.est) + ' ≈ ' + rm0(it.est * r) + ' · ' + esc(it.who) + '</div></div>' +
        '<div style="display: flex; align-items: center; gap: 4px; height: 44px; padding: 0 10px; box-sizing: border-box; border: 1px solid ' + P.hair + '; border-radius: 10px; background: ' + P.surface + '"><span aria-hidden="true" style="font-size: 13px; font-weight: 500; color: ' + P.stone + '; white-space: nowrap">Paid ¥</span>' +
        '<input class="tnum" inputmode="numeric" placeholder="0" data-paid="' + it.id + '" value="' + esc(it.paid) + '" aria-label="Paid in yen for ' + esc(it.name) + '" style="flex: 1; min-width: 0; width: 0; border: 0; background: transparent; color: ' + P.ink + '; font-size: 16px; font-weight: 700; text-align: right; padding: 0"></div>' +
        '</li>';
    }).join('');
  }

  function renderTotals() {
    const r = num(rateIn.value) / 100;
    const banked = num(bankIn.value);
    let estY = 0, paidY = 0, leftY = 0, boughtN = 0;
    items.forEach(function (it) {
      estY += it.est; paidY += num(it.paid);
      if (it.bought) boughtN += 1; else leftY += it.est;
    });
    const bal = banked - paidY * r - leftY * r;
    k('estimated').textContent = rm(estY * r);
    k('spent').textContent = rm(paidY * r);
    const b = k('balance');
    b.textContent = (bal < 0 ? '−' : '') + rm(Math.abs(bal));
    b.style.color = bal < 0 ? P.now : P.done;
    k('balanceNote').textContent = bal < 0 ? 'Not enough. Ask her to bank in more, or drop an item.' : 'Banked in, minus spent and still to buy.';
    k('countLine').textContent = items.length + ' items · ' + boughtN + ' bought';
  }

  list.addEventListener('change', function (e) {
    const id = e.target.dataset.id;
    if (!id) return;
    items.find(function (x) { return x.id === id; }).bought = e.target.checked;
    renderList(); renderTotals();
  });
  list.addEventListener('input', function (e) {
    const id = e.target.dataset.paid;
    if (!id) return;
    items.find(function (x) { return x.id === id; }).paid = e.target.value;
    renderTotals(); // don't re-render the list, so the input keeps focus
  });
  [rateIn, bankIn].forEach(function (el) {
    el.addEventListener('input', function () { renderList(); renderTotals(); });
  });
  renderList(); renderTotals();
}

/* ---------- mount ---------- */
Object.keys(CONFIGS).forEach(function (id) {
  const root = document.getElementById(id);
  const cfg = CONFIGS[id];
  if (cfg.kind === 'tl') mountTimeline(root, cfg);
  else if (cfg.kind === 'shop') mountShopping(root, cfg);
});

</script>
